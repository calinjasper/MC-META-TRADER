<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PocketBase Data Viewer{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1>PocketBase Data Viewer</h1>
            <div class="nav-links">
                <a href="/" class="nav-link">Data Viewer</a>
                <a href="/backtest" class="nav-link">Backtester</a>
            </div>
        </div>
    </nav>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2025 PocketBase Data Viewer</p>
        </div>
    </footer>
    
    {% block scripts %}{% endblock %}
</body>
</html>
